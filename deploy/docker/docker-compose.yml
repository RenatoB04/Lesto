services:
  postgres:
    image: postgres:17-alpine
    container_name: lesto-postgres
    restart: always
    env_file:
      - ../../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  identity-service:
    build:
      context: ../../src/IdentityService
      dockerfile: Dockerfile
    container_name: lesto-identity
    restart: always
    env_file:
      - ../../.env
    ports:
      - "5001:8080"
    environment:
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy

  order-service-1:
    build:
      context: ../../src/OrderService
      dockerfile: Dockerfile
    image: lesto-order-service
    container_name: lesto-order-1
    restart: always
    env_file:
      - ../../.env
    ports:
      - "5002:8080"
    environment:
      - DB_HOST=postgres
      - IDENTITY_API_URL=http://identity-service:8080
      - INSTANCE_NAME=order-service-1
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_started

  order-service-2:
    image: lesto-order-service
    pull_policy: never
    container_name: lesto-order-2
    restart: always
    env_file:
      - ../../.env
    ports:
      - "5003:8080"
    environment:
      - DB_HOST=postgres
      - IDENTITY_API_URL=http://identity-service:8080
      - INSTANCE_NAME=order-service-2
    depends_on:
      postgres:
        condition: service_healthy
      order-service-1:
        condition: service_started
      identity-service:
        condition: service_started

  payment-service:
    build:
      context: ../../src/PaymentService
      dockerfile: Dockerfile
    container_name: lesto-payment
    restart: always
    env_file:
      - ../../.env
    ports:
      - "5004:8080"
    environment:
      - DB_HOST=postgres
      - ORDER_INTERNAL_URL=http://order-service-1:8080
    depends_on:
      - postgres
      - order-service-1

  api-gateway:
    build:
      context: ../../src/ApiGateway
      dockerfile: Dockerfile
    container_name: lesto-gateway
    restart: always
    env_file:
      - ../../.env
    ports:
      - "5000:8080"
    environment:
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-service:8080
      - ReverseProxy__Clusters__order-cluster__LoadBalancingPolicy=RoundRobin
      - ReverseProxy__Clusters__order-cluster__Destinations__destination1__Address=http://order-service-1:8080
      - ReverseProxy__Clusters__order-cluster__Destinations__destination2__Address=http://order-service-2:8080
      - ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address=http://payment-service:8080
    depends_on:
      - identity-service
      - order-service-1
      - order-service-2
      - payment-service

volumes:
  postgres_data: